<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHMAX – Avaliação Gratuita</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --white: #FFFFFF;
    --green: #B4FF2E;
    --green-dim: rgba(180,255,46,0.12);
    --green-glow: rgba(180,255,46,0.28);
    --gray: #111111;
    --gray2: #1a1a1a;
    --muted: #777777;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(180,255,46,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180,255,46,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }
  .page.active { display: flex; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px 0;
    position: relative;
  }

  .btn-back {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 22px;
    transition: color 0.2s;
    padding: 4px;
  }
  .btn-back:hover { color: var(--white); }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--green);
    text-shadow: 0 0 20px var(--green-glow);
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .progress-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* Progress bar */
  .progress-wrap {
    padding: 14px 24px 0;
  }
  .progress-track {
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 10px var(--green-glow);
  }

  /* Content area */
  .content {
    flex: 1;
    padding: 32px 24px 24px;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
    width: 100%;
  }

  .question {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(26px, 5vw, 38px);
    line-height: 1.1;
    letter-spacing: 1px;
    color: var(--white);
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Cards */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .card {
    background: var(--gray);
    border: 1.5px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 15px;
    font-weight: 600;
    color: var(--white);
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--green-dim);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .card:hover {
    border-color: rgba(0,204,68,0.4);
    transform: translateX(4px);
  }

  .card.selected {
    border-color: var(--green);
    box-shadow: 0 0 18px var(--green-glow), inset 0 0 0 1px var(--green);
  }
  .card.selected::before { opacity: 1; }

  .card-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    transition: all 0.2s;
    position: relative;
    z-index: 1;
  }
  .card.selected .card-check {
    background: var(--green);
    border-color: var(--green);
    color: var(--black);
  }

  .card-text { position: relative; z-index: 1; line-height: 1.3; }

  /* Objective cards with visual */
  .card-obj {
    flex-direction: column;
    align-items: flex-start;
    padding: 18px;
  }
  .card-obj-header {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
  }
  .card-obj-icon {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: var(--gray2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .card-obj-title { font-size: 17px; font-weight: 900; }
  .card-obj-desc {
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
    position: relative;
    z-index: 1;
    padding-left: 56px;
  }

  /* Input fields */
  .input-field {
    background: var(--gray);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 16px;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    width: 100%;
    transition: border-color 0.2s;
    outline: none;
    margin-bottom: 12px;
  }
  .input-field:focus {
    border-color: var(--green);
    box-shadow: 0 0 12px var(--green-glow);
  }
  .input-field::placeholder { color: var(--muted); font-weight: 400; }

  .input-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
    display: block;
  }

  .fields-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  /* CTA Button */
  .btn-continue {
    background: var(--green);
    color: var(--black);
    border: none;
    border-radius: 10px;
    padding: 18px 24px;
    font-family: 'Barlow', sans-serif;
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    margin-top: 20px;
    box-shadow: 0 4px 24px var(--green-glow);
  }
  .btn-continue:hover {
    background: #00e84d;
    transform: translateY(-2px);
    box-shadow: 0 8px 32px var(--green-glow);
  }
  .btn-continue:active { transform: translateY(0); }
  .btn-continue:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
  }

  /* Scheduling */
  .days-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .day-btn {
    background: var(--gray);
    border: 1.5px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 14px 8px;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .day-btn:hover { border-color: rgba(0,204,68,0.4); }
  .day-btn.selected {
    border-color: var(--green);
    box-shadow: 0 0 14px var(--green-glow);
    color: var(--green);
  }

  .times-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 8px;
  }
  .time-btn {
    background: var(--gray);
    border: 1.5px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 14px 8px;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .time-btn:hover { border-color: rgba(0,204,68,0.4); }
  .time-btn.selected {
    border-color: var(--green);
    box-shadow: 0 0 14px var(--green-glow);
    color: var(--green);
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--green);
    margin-bottom: 12px;
  }

  /* Result pages */
  .result-page {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 28px;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }

  .result-icon {
    font-size: 56px;
    margin-bottom: 24px;
  }

  .result-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(32px, 7vw, 50px);
    letter-spacing: 2px;
    color: var(--green);
    margin-bottom: 16px;
    text-shadow: 0 0 30px var(--green-glow);
    line-height: 1;
  }

  .result-text {
    font-size: 16px;
    line-height: 1.7;
    color: rgba(255,255,255,0.85);
    margin-bottom: 36px;
    font-weight: 400;
  }

  .result-text strong { color: var(--white); font-weight: 700; }

  .disqualified-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(26px, 6vw, 40px);
    letter-spacing: 1px;
    color: var(--white);
    margin-bottom: 16px;
  }

  .instagram-handle {
    font-size: 20px;
    font-weight: 900;
    color: var(--green);
    letter-spacing: 1px;
  }

  .confirmation-box {
    background: var(--gray);
    border: 1.5px solid var(--green);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 24px;
    width: 100%;
    box-shadow: 0 0 30px var(--green-glow);
  }
  .conf-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 14px;
  }
  .conf-row:last-child { border-bottom: none; }
  .conf-key { color: var(--muted); font-weight: 600; }
  .conf-val { color: var(--white); font-weight: 700; }

  /* Pulse animation on logo */
  @keyframes pulse-green {
    0%, 100% { text-shadow: 0 0 20px rgba(180,255,46,0.35); }
    50% { text-shadow: 0 0 40px rgba(180,255,46,0.7), 0 0 60px rgba(180,255,46,0.25); }
  }
  .logo { animation: pulse-green 3s ease-in-out infinite; }

  /* Fade in animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .page.active { animation: fadeIn 0.35s ease forwards; }

  /* Scrollable content on smaller screens */
  .content { overflow-y: auto; }

  @media (max-width: 400px) {
    .fields-row { grid-template-columns: 1fr; }
    .days-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- PAGES 1-14 generated by JS below -->

<script>
const state = {
  current: 1,
  answers: {},
  name: '',
  whatsapp: '',
  scheduledDay: '',
  scheduledTime: ''
};

const totalPages = 14;

const pages = [
  {
    id: 1,
    type: 'multi',
    question: 'Você já tentou algumas dessas coisas para melhorar o seu corpo nos últimos 6 meses?',
    subtitle: 'SELEÇÃO MÚLTIPLA',
    options: [
      'Fiz o uso de medicamentos ou hormônios',
      'Fiz procedimentos estéticos',
      'Passei por consulta com médico ou nutricionista',
      'Fiz acompanhamento com personal',
      'Fiz o uso de suplementos',
      'Nenhum dos anteriores'
    ]
  },
  {
    id: 2,
    type: 'single',
    question: 'Usa suplementos? Se sim, quantos por dia?',
    options: [
      'Não uso nenhum',
      'Uso 1 suplemento',
      'Uso 2 suplementos',
      'Uso 3 suplementos',
      'Uso 4 ou mais suplementos'
    ]
  },
  {
    id: 3,
    type: 'single',
    question: 'Você já teve algum acompanhamento individual?',
    options: [
      'Sim, acompanhamento nutricional',
      'Sim, consultoria de treino',
      'Sim, os dois',
      'Nunca tive'
    ]
  },
  {
    id: 4,
    type: 'single',
    question: 'Com as estratégias que você está seguindo, você acredita que vai ter o corpo que deseja?',
    options: [
      'Infelizmente não',
      'Acho que posso ter, mas vai demorar bastante',
      'Do jeito que estou indo consigo ter'
    ]
  },
  {
    id: 5,
    type: 'single',
    question: 'Qual seu nível de vontade de mudar o corpo hoje?',
    options: [
      'Tenho muita vontade e é prioridade',
      'Quero mudar, mas não é prioridade',
      'Estou satisfeito assim'
    ]
  },
  {
    id: 6,
    type: 'single',
    question: 'Se você encontrasse um protocolo de treino e dieta que mudasse o corpo entre 60 e 90 dias, você estaria disposto a investir hoje?',
    options: [
      'Sim, estaria disposto',
      'Gostaria, mas não posso neste momento',
      'Não estaria disposto'
    ]
  },
  {
    id: 7,
    type: 'single',
    question: 'Quanto você costuma investir por mês em cuidados com o seu corpo?',
    options: [
      'R$0 a R$50',
      'R$51 a R$100',
      'R$101 a R$150',
      'R$151 a R$200',
      'R$201 a R$300',
      'R$301 a R$500',
      'R$501 a R$1.000',
      'Mais de R$1.000'
    ]
  },
  {
    id: 8,
    type: 'text',
    question: 'Com o que você trabalha?',
    placeholder: 'Digite sua profissão...',
    key: 'job'
  },
  {
    id: 9,
    type: 'physical',
    title: 'Seus dados físicos.'
  },
  {
    id: 10,
    type: 'single',
    question: 'Quantas vezes você treina por semana?',
    options: [
      'Não treino',
      '1 a 2x por semana',
      '3 a 4x por semana',
      '5 a 6x por semana',
      'Todos os dias'
    ]
  },
  {
    id: 11,
    type: 'objective',
    question: 'Qual é o seu objetivo?',
    options: [
      { icon: '🔥', title: 'Emagrecimento', desc: 'Reduzir gordura corporal com leveza, saúde e consistência.' },
      { icon: '💪', title: 'Hipertrofia', desc: 'Aumentar massa muscular e conquistar um corpo mais forte.' },
      { icon: '⚡', title: 'Recomposição corporal', desc: 'Perder gordura e ganhar músculo ao mesmo tempo.' }
    ]
  },
  {
    id: 12,
    type: 'text',
    question: 'Qual é o seu nome?',
    placeholder: 'Digite seu nome...',
    key: 'name'
  },
  {
    id: 13,
    type: 'text',
    question: 'Qual o seu @ do Instagram?',
    placeholder: '@seuinstagram',
    key: 'instagram'
  },
  {
    id: 14,
    type: 'text',
    question: 'Qual seu WhatsApp?',
    placeholder: '(00) 00000-0000',
    key: 'whatsapp'
  }
];

function qualify() {
  const p5 = state.answers[5];
  const p6 = state.answers[6];
  const p7 = state.answers[7];

  const c1 = p5 === 'Tenho muita vontade e é prioridade' || p5 === 'Quero mudar, mas não é prioridade';
  const c2 = p6 === 'Sim, estaria disposto' || p6 === 'Gostaria, mas não posso neste momento';
  const disqualifiedValues = ['R$0 a R$50', 'R$51 a R$100', 'R$101 a R$150', 'R$151 a R$200'];
  const c3 = !disqualifiedValues.includes(p7);

  return c1 && c2 && c3;
}

function renderPage(num) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const el = document.getElementById('page-' + num);
  if (el) el.classList.add('active');
}

function buildPages() {
  const body = document.body;

  pages.forEach((pg) => {
    const div = document.createElement('div');
    div.className = 'page';
    div.id = 'page-' + pg.id;

    div.innerHTML = `
      <div class="header">
        ${pg.id > 1 ? `<button class="btn-back" onclick="goBack(${pg.id})">&#8592;</button>` : '<div></div>'}
        <div class="logo">PHMAX</div>
        <div class="progress-label">${pg.id} de ${totalPages}</div>
      </div>
      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" style="width:${(pg.id/totalPages)*100}%"></div>
        </div>
      </div>
      <div class="content" id="content-${pg.id}"></div>
    `;

    body.appendChild(div);
    buildContent(pg);
  });

  // Build special pages
  buildQualifiedTransition();
  buildScheduling();
  buildConfirmation();
  buildDisqualified();
}

function buildContent(pg) {
  const content = document.getElementById('content-' + pg.id);

  if (pg.type === 'multi' || pg.type === 'single') {
    content.innerHTML = `
      <div class="question">${pg.question}</div>
      ${pg.type === 'multi' ? '<div class="subtitle">Selecione todas que se aplicam</div>' : '<div class="subtitle">Selecione uma opção</div>'}
      <div class="options" id="opts-${pg.id}">
        ${pg.options.map((opt, i) => `
          <div class="card" id="card-${pg.id}-${i}" onclick="selectOption(${pg.id}, ${i}, '${pg.type}', \`${opt.replace(/`/g,'\\`')}\`)">
            <div class="card-check">✓</div>
            <div class="card-text">${opt}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn-continue" id="btn-${pg.id}" onclick="nextPage(${pg.id})" disabled>CONTINUAR</button>
    `;
  } else if (pg.type === 'text') {
    content.innerHTML = `
      <div class="question">${pg.question}</div>
      <div class="subtitle" style="margin-bottom:32px">CAMPO ABERTO</div>
      <input class="input-field" id="input-${pg.id}" type="text" placeholder="${pg.placeholder}" 
             oninput="onTextInput(${pg.id}, '${pg.key}', this.value)" style="margin-top:8px"/>
      <button class="btn-continue" id="btn-${pg.id}" onclick="nextPage(${pg.id})" disabled>CONTINUAR</button>
    `;
  } else if (pg.type === 'physical') {
    content.innerHTML = `
      <div class="question">${pg.title}</div>
      <div class="subtitle" style="margin-bottom:28px">PREENCHA SEUS DADOS</div>
      <div>
        <label class="input-label">Idade</label>
        <input class="input-field" id="input-age" type="number" placeholder="Ex: 28" oninput="checkPhysical()"/>
        <label class="input-label">Peso (kg)</label>
        <input class="input-field" id="input-weight" type="number" placeholder="Ex: 75" oninput="checkPhysical()"/>
        <label class="input-label">Altura (cm)</label>
        <input class="input-field" id="input-height" type="number" placeholder="Ex: 175" oninput="checkPhysical()"/>
      </div>
      <button class="btn-continue" id="btn-${pg.id}" onclick="nextPage(${pg.id})" disabled>CONTINUAR</button>
    `;
  } else if (pg.type === 'objective') {
    content.innerHTML = `
      <div class="question">${pg.question}</div>
      <div class="subtitle" style="margin-bottom:24px">SELECIONE UMA OPÇÃO</div>
      <div class="options" id="opts-${pg.id}">
        ${pg.options.map((opt, i) => `
          <div class="card card-obj" id="card-${pg.id}-${i}" onclick="selectOption(${pg.id}, ${i}, 'single', \`${opt.title.replace(/`/g,'\\`')}\`)">
            <div class="card-obj-header">
              <div class="card-obj-icon">${opt.icon}</div>
              <div>
                <div class="card-obj-title">${opt.title}</div>
                <div class="card-check" style="display:none">✓</div>
              </div>
              <div class="card-check" style="margin-left:auto">✓</div>
            </div>
            <div class="card-obj-desc">${opt.desc}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn-continue" id="btn-${pg.id}" onclick="nextPage(${pg.id})" disabled>CONTINUAR</button>
    `;
  }
}

function buildQualifiedTransition() {
  const div = document.createElement('div');
  div.className = 'page';
  div.id = 'page-qualified';
  div.innerHTML = `
    <div class="header" style="padding:18px 24px 0">
      <div></div>
      <div class="logo">PHMAX</div>
      <div></div>
    </div>
    <div class="content">
      <div class="result-page">
        <div class="result-icon">🎯</div>
        <div class="result-title" id="qual-title">PERFEITO!</div>
        <p class="result-text" id="qual-text"></p>
        <button class="btn-continue" style="max-width:400px" onclick="goToScheduling()">AGENDAR AGORA</button>
      </div>
    </div>
  `;
  document.body.appendChild(div);
}

function buildScheduling() {
  const div = document.createElement('div');
  div.className = 'page';
  div.id = 'page-scheduling';

  const weekdays = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

  div.innerHTML = `
    <div class="header" style="padding:18px 24px 0">
      <div></div>
      <div class="logo">PHMAX</div>
      <div></div>
    </div>
    <div class="content">
      <div class="question" style="margin-bottom:6px">Escolha o melhor dia e horário para sua avaliação gratuita.</div>
      <div class="subtitle" style="margin-bottom:28px">100% GRATUITO · SEM COMPROMISSO</div>

      <div class="section-label">PASSO 1 — Escolha o dia</div>
      <div class="days-grid">
        ${weekdays.map(d => `
          <button class="day-btn" id="day-${d}" onclick="selectDay('${d}')">${d}</button>
        `).join('')}
      </div>

      <div id="times-section" style="display:none">
        <div class="section-label">PASSO 2 — Escolha o horário</div>
        <div class="times-grid" id="times-grid"></div>
      </div>

      <button class="btn-continue" id="btn-confirm" onclick="confirmScheduling()" disabled>CONFIRMAR AGENDAMENTO</button>
    </div>
  `;
  document.body.appendChild(div);
}

function buildConfirmation() {
  const div = document.createElement('div');
  div.className = 'page';
  div.id = 'page-confirmation';
  div.innerHTML = `
    <div class="header" style="padding:18px 24px 0">
      <div></div>
      <div class="logo">PHMAX</div>
      <div></div>
    </div>
    <div class="content">
      <div class="result-page">
        <div class="result-icon">✅</div>
        <div class="result-title">AGENDADO!</div>
        <p class="result-text" id="conf-text"></p>
        <div class="confirmation-box" id="conf-box"></div>
        <p style="color:var(--muted); font-size:13px; font-weight:600">Em breve entrarei em contato pelo WhatsApp para confirmar os detalhes. Te vejo lá.</p>
      </div>
    </div>
  `;
  document.body.appendChild(div);
}

function buildDisqualified() {
  const div = document.createElement('div');
  div.className = 'page';
  div.id = 'page-disqualified';
  div.innerHTML = `
    <div class="header" style="padding:18px 24px 0">
      <div></div>
      <div class="logo">PHMAX</div>
      <div></div>
    </div>
    <div class="content">
      <div class="result-page">
        <div class="result-icon" style="font-size:48px">🙏</div>
        <div class="disqualified-title" id="disq-title"></div>
        <p class="result-text">No momento o seu perfil não se encaixa no que eu trabalho. Mas continua me acompanhando no Instagram. Tenho muito conteúdo gratuito que pode te ajudar agora.</p>
        <div class="instagram-handle">@phelipemaxoficial</div>
      </div>
    </div>
  `;
  document.body.appendChild(div);
}

// Interactions
const multiSelections = {};

function selectOption(pageId, idx, type, value) {
  if (type === 'multi') {
    if (!multiSelections[pageId]) multiSelections[pageId] = new Set();
    const card = document.getElementById('card-' + pageId + '-' + idx);
    if (multiSelections[pageId].has(idx)) {
      multiSelections[pageId].delete(idx);
      card.classList.remove('selected');
    } else {
      multiSelections[pageId].add(idx);
      card.classList.add('selected');
    }
    const selectedValues = [...multiSelections[pageId]].map(i => {
      const pg = pages.find(p => p.id === pageId);
      return pg.options[i];
    });
    state.answers[pageId] = selectedValues;
    document.getElementById('btn-' + pageId).disabled = multiSelections[pageId].size === 0;
  } else {
    // Single
    document.querySelectorAll(`[id^="card-${pageId}-"]`).forEach(c => c.classList.remove('selected'));
    document.getElementById('card-' + pageId + '-' + idx).classList.add('selected');
    state.answers[pageId] = value;
    document.getElementById('btn-' + pageId).disabled = false;
  }
}

function onTextInput(pageId, key, value) {
  state.answers[pageId] = value;
  if (key === 'name') state.name = value.trim();
  if (key === 'whatsapp') state.whatsapp = value.trim();
  document.getElementById('btn-' + pageId).disabled = value.trim().length === 0;
}

function checkPhysical() {
  const age = document.getElementById('input-age').value;
  const weight = document.getElementById('input-weight').value;
  const height = document.getElementById('input-height').value;
  state.answers[9] = { age, weight, height };
  document.getElementById('btn-9').disabled = !(age && weight && height);
}

function nextPage(currentId) {
  if (currentId === 14) {
    // Check qualification
    if (qualify()) {
      document.getElementById('qual-title').textContent = 'PERFEITO, ' + state.name.split(' ')[0].toUpperCase() + '!';
      document.getElementById('qual-text').innerHTML = `Suas respostas mostram que você está <strong>pronto para mudar</strong>. O próximo passo é agendar sua avaliação gratuita. É rápido, sem compromisso e 100% focado no seu caso.`;
      renderPage('qualified');
    } else {
      document.getElementById('disq-title').textContent = state.name.split(' ')[0] + ', obrigado por responder.';
      renderPage('disqualified');
    }
    return;
  }
  state.current = currentId + 1;
  renderPage(currentId + 1);
}

function goBack(currentId) {
  if (currentId <= 1) return;
  state.current = currentId - 1;
  renderPage(currentId - 1);
}

function goToScheduling() {
  renderPage('scheduling');
}

function selectDay(day) {
  state.scheduledDay = day;
  state.scheduledTime = '';

  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('day-' + day).classList.add('selected');

  const isSaturday = day === 'Sábado';
  const times = isSaturday ? ['10h00', '11h00', '12h00', '14h00'] : ['13h00', '14h00', '15h00', '20h00'];

  const timesGrid = document.getElementById('times-grid');
  timesGrid.innerHTML = times.map(t => `
    <button class="time-btn" id="time-${t}" onclick="selectTime('${t}')">${t}</button>
  `).join('');

  document.getElementById('times-section').style.display = 'block';
  document.getElementById('btn-confirm').disabled = true;
}

function selectTime(time) {
  state.scheduledTime = time;
  document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('time-' + time).classList.add('selected');
  document.getElementById('btn-confirm').disabled = false;
}

function confirmScheduling() {
  const name = state.name.split(' ')[0];
  document.getElementById('conf-text').innerHTML = `<strong>${name}</strong>, seu agendamento está confirmado!`;
  document.getElementById('conf-box').innerHTML = `
    <div class="conf-row">
      <span class="conf-key">📅 Dia</span>
      <span class="conf-val">${state.scheduledDay}</span>
    </div>
    <div class="conf-row">
      <span class="conf-key">⏰ Horário</span>
      <span class="conf-val">${state.scheduledTime}</span>
    </div>
    <div class="conf-row">
      <span class="conf-key">📱 WhatsApp</span>
      <span class="conf-val">${state.whatsapp}</span>
    </div>
    <div class="conf-row">
      <span class="conf-key">🎯 Tipo</span>
      <span class="conf-val">Avaliação Gratuita</span>
    </div>
  `;
  renderPage('confirmation');
}

// Init
buildPages();
renderPage(1);
</script>
</body>
</html>
